<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Award-winning Palette Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    /* --------------------------------------------------
       GLOBAL STYLES (Glassmorphism + Neumorphism)
    -------------------------------------------------- */

    body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #0f0f0f, #1b1b1b);
        font-family: "Poppins", sans-serif;
        overflow-x: hidden;
        color: white;
    }

    .app-container {
        width: 90%;
        max-width: 1200px;
        margin: 50px auto;
        text-align: center;
    }

    h1 {
        font-size: 2.8rem;
        letter-spacing: 1px;
        font-weight: 700;
        margin-bottom: 25px;
        color: #fff;
        text-shadow: 0 0 15px rgba(255,255,255,0.2);
    }

    /* ----------------------------------------------
        BUTTON (Glass + Glow)
    ---------------------------------------------- */

    button {
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.25);
        padding: 14px 28px;
        border-radius: 12px;
        cursor: pointer;
        color: #fff;
        backdrop-filter: blur(10px);
        font-size: 1.1rem;
        transition: 0.25s ease;
        margin-bottom: 35px;
    }

    button:hover {
        background: rgba(255,255,255,0.2);
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(255,255,255,0.15);
    }


    /* -----------------------------------------------------
        PALETTE GRID
    ------------------------------------------------------ */

    .palette {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 25px;
    }

    .color-card {
        background: rgba(255,255,255,0.08);
        padding: 25px;
        border-radius: 22px;
        backdrop-filter: blur(15px);
        text-align: center;
        transition: 0.3s ease;
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.12);
    }

    .color-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 25px 35px rgba(0,0,0,0.35);
    }

    /* Color box */
    .color-preview {
        height: 130px;
        border-radius: 16px;
        margin-bottom: 15px;
        transition: 0.3s ease;
        cursor: pointer;
    }

    .hex {
        font-size: 1.1rem;
        margin-bottom: 10px;
        font-weight: 500;
    }

    /* Buttons inside card */
    .card-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
    }

    .small-btn {
        background: rgba(255,255,255,0.08);
        padding: 8px 16px;
        border-radius: 50px;
        font-size: 0.9rem;
        cursor: pointer;
        transition: 0.25s ease;
    }

    .small-btn:hover {
        background: rgba(255,255,255,0.2);
    }

    .locked {
        color: #ff7676;
    }

    /* Copy animation */
    .copied-toast {
        position: fixed;
        top: 30px;
        right: 30px;
        background: rgba(255,255,255,0.15);
        padding: 15px 25px;
        border-radius: 12px;
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255,255,255,0.25);
        opacity: 0;
        font-size: 1rem;
        transition: 0.3s ease;
        transform: translateY(-20px);
    }

    .copied-toast.show {
        opacity: 1;
        transform: translateY(0px);
    }

</style>

</head>
<body>

<div class="app-container">
    <h1>AI Color Palette Generator 🎨✨</h1>

    <button id="generate-btn">Generate New Palette</button>

    <div class="palette" id="palette"></div>
</div>

<div id="toast" class="copied-toast">Copied!</div>

<script>

    const paletteContainer = document.getElementById("palette");
    const toast = document.getElementById("toast");

    const NUM_COLORS = 5;

    function getRandomColor() {
        const letters = "0123456789ABCDEF";
        let color = "#";
        for (let i = 0; i < 6; i++) {
            color += letters[Math.floor(Math.random() * letters.length)];
        }
        return color;
    }

    // Calculate readable text color
    function getContrastYIQ(hex) {
        hex = hex.replace("#", "");
        const r = parseInt(hex.substr(0,2),16);
        const g = parseInt(hex.substr(2,2),16);
        const b = parseInt(hex.substr(4,2),16);

        const yiq = (r*299 + g*587 + b*114) / 1000;
        return yiq >= 128 ? "#000" : "#fff";
    }

    let lockStates = Array(NUM_COLORS).fill(false);

    function generatePalette() {
        paletteContainer.innerHTML = "";

        for (let i = 0; i < NUM_COLORS; i++) {
            const color = lockStates[i] ? lockStates[i] : getRandomColor();

            const card = document.createElement("div");
            card.classList.add("color-card");

            card.innerHTML = `
                <div class="color-preview" style="background: ${color};"></div>
                <div class="hex" style="color: ${getContrastYIQ(color)}">${color}</div>

                <div class="card-actions">
                    <div class="small-btn copy-btn" data-color="${color}">Copy</div>
                    <div class="small-btn lock-btn ${lockStates[i] ? 'locked' : ''}" data-index="${i}">
                        ${lockStates[i] ? "Unlock" : "Lock"}
                    </div>
                </div>
            `;

            paletteContainer.appendChild(card);

            // Save locked color state
            if (lockStates[i]) {
                lockStates[i] = color;
            }
        }
    }

    // Copy HEX
    function showToast() {
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 1500);
    }

    paletteContainer.addEventListener("click", (e) => {
        if (e.target.classList.contains("copy-btn")) {
            navigator.clipboard.writeText(e.target.dataset.color);
            showToast();
        }

        if (e.target.classList.contains("lock-btn")) {
            const i = parseInt(e.target.dataset.index);
            lockStates[i] = lockStates[i] ? false : paletteContainer.children[i].querySelector(".hex").textContent;
            generatePalette();
        }
    });

    document.getElementById("generate-btn").addEventListener("click", () => {
        generatePalette();
    });

    generatePalette();

</script>

</body>
</html>
