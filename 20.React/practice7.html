<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice</title>
</head>
<body>
  <button>9a</button>
  <button class="btn_b">9b</button>
  <button onclick="document.querySelector(`p`).innerHTML=`You choose heads`">heads</button>
  <button onclick="document.querySelector(`p`).innerHTML=`You choose tails`">tails</button>
  <input type="text" class="input-val" onkeydown="keyDownEvent(event)">
  <button class="submit-btn" onclick="submit()">Submit</button>
  <input type="text" name="" id="onkeyup" onkeyup="document.querySelector(`p`).innerHTML=document.querySelector(`#onkeyup`).value">
  <p></p>
  <script>
    const btn_a = document.querySelector("button").innerHTML
    console.log(btn_a)
    document.querySelector(".btn_b").innerHTML="9b done!"

    function submit(){
      const value = document.querySelector(".input-val").value
      document.querySelector("p").innerHTML=`Your name is: ${value}`
    }

    function keyDownEvent(event){
      if(event.key==="Enter"){
        submit()
      }
    }
  </script>
</body>
</html>
