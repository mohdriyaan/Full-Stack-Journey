<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Basics Exercise</title>
</head>
<body>
  <div class="js-container"></div>

  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
  <script src="https://unpkg.com/supersimpledev/babel.js"></script>
  <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

  <script type="text/babel">
    const container = document.querySelector(".js-container")
    
    const btn = <button>Good Job!</button>
    const p = <p>My name is Jack</p>

    const productCost = 10*1+2*8
    console.log(productCost)
    const shippingCost = 5
    const totalCost = productCost+shippingCost 

    const currentDate = dayjs().format("MMMM D")
    console.log(currentDate)
    
    const div = (
      <div>
        <p>Today is {currentDate}</p>
        <p>Product cost: ${productCost}</p>
        <p>Cotton socks</p>
        <p>Price: $10</p>
        <button>Add to Cart</button>  
      </div>
    )

    // const orderDiv = (
    //   <div>
    //     <p>CurrentTime: {currentTime}</p>
    //     <p>Today is {currentDate}</p>
    //     <p>Product cost: ${productCost}</p>
    //     <p>Shipping Cost: ${shippingCost}</p>
    //     <p>Total Cost: ${totalCost}</p>
    //     <button>Place your order</button>
    //   </div>
    // )

    const root = ReactDOM.createRoot(container)

    setInterval(()=>{
      const currentTime = dayjs().format("HH:mm:ss")
      const orderDiv = (
        <div>
          <p>CurrentTime: {currentTime}</p>
          <p>Today is {currentDate}</p>
          <p>Product cost: ${productCost}</p>
          <p>Shipping Cost: ${shippingCost}</p>
          <p>Total Cost: ${totalCost}</p>
          <button>Place your order</button>
        </div>
      )
      
      root.render(orderDiv)
    },1000)

  </script>
</body>
</html>
