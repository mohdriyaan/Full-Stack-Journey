<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{
      font-family: Arial, Helvetica, sans-serif;
    }
    .subscribe-button{
      border: none;
      background-color: black;
      color: white;
      padding: 10px 15px 10px 15px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      margin-bottom: 30px;
    }
    .is-subscribed{
      background-color: rgb(240,240,240);
      color: black;
    }

    .cost-input{
      font-size: 15px;
      padding: 10px;
    }

    .calculate-btn{
      color: white;
      background-color: green;
      padding: 11.8px 15px;
      border: none;
      font-size: 15px;
      cursor: pointer;
    }

    .warning{
      color: red;
    }
    
  </style>
  <title>DOM Practice</title>
</head>

<body>
  <p>Youtube Subscribe Button</p>
  <button onclick="subscribe()" class="js-subscribe-btn subscribe-button">Subscribe</button>
  
  <p>Amazon Shipping Calculator</p>
  <p>Orders under $40 = +$10 shipping.</p>
  <p>Orders over $40 = FREE shipping</p>
  <input class="value cost-input" type="text" onkeydown="keydownEvent(event)" placeholder="Cost of order">
  <button onclick="calculate()" class="calculate-btn">Calculate</button>
  <p class="calculation"></p>
  
  <script>
    function subscribe() {
      let btnElement = document.querySelector(`.js-subscribe-btn`)

      if (btnElement.innerText === `Subscribe`) {
        btnElement.innerHTML = `Subscribed`
        btnElement.classList.add("is-subscribed")
      } else {
        btnElement.innerHTML = `Subscribe`
        btnElement.classList.remove("is-subscribed")
      }
    }

    function calculate(){
      let value = Number(document.querySelector(`.value`).value)*100;
      if(value<0){
        document.querySelector(`.calculation`).innerHTML = `Error: cost cannot be less than $0`
        document.querySelector(`.calculation`).classList.add("warning")
        return;  
      }
      document.querySelector(`.calculation`).classList.remove("warning")
      if(value<4000){
        value = (value+1000)/100
      }else{
        value/=100
      }
      document.querySelector(`.calculation`).innerHTML = `$${value}`
    }

    function keydownEvent(event){
      if(event.key=="Enter"){
        calculate()
      }
    }
  </script>
</body>

</html>
