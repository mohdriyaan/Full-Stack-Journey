<!DOCTYPE html>
<html>

<head>
  <title>Chatbot</title>
  <style>
    body {
      font-family: Arial;
      margin-top: 0px;
      margin-bottom: 0px
    }

    .send-button {
      background-color: rgb(25, 135, 84);
      color: white;
      padding: 12px 20px;
      margin-left: 10px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    .chat-input {
      padding: 12px 15px;
      border-radius: 10px;
      border-width: 1px;
      font-size: 15px;
      flex-grow: 1;
    }

    .chat-input-container {
      display: flex;
      margin-bottom: 60px;
      flex-shrink: 0;
    }

    .app-container {
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .chat-message-user {
      display: flex;
      justify-content: end;
      align-items: start;
    }

    .chat-message-robot {
      display: flex;
      align-items: start;
    }

    .chat-message-text {
      background-color: rgb(238, 238, 238);
      padding: 15px 20px;
      border-radius: 10px;
      margin-right: 10px;
      margin-left: 10px;
      margin-bottom: 20px;
      max-width: 300px;
    }

    .chat-message-profile {
      width: 45px;
    }

    .chat-messages-container {
      flex-grow: 1;
      min-height: 0;
      margin-top: 20px;
      overflow-y: auto;
      scrollbar-width: none;
    }
  </style>
</head>

<body>
  <div class="js-container"></div>

  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
  <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

  <script src="https://unpkg.com/supersimpledev/babel.js"></script>

  <script type="text/babel">
    // JSX Code

    // Components 

    // <>, </> - Fragement : Groups elements together without using div
    // <ChatInput /> - Componnent Syntax 
    function ChatInput({ chatMessages, setChatMessages }) {
      const [inputText, setInputText] = React.useState("")

      const [isLoading, setIsLoading] = React.useState(false)

      function saveInputText(event) {
        setInputText(event.target.value)
      }

      function sendUsingEnter(event) {
        if (event.key === "Enter") {
          sendMessage()
        }
        if (event.key === "Escape") {
          setInputText(
            value => value = ""
          )
        }
      }

      async function sendMessage() {
        if (isLoading || inputText === "") {
          return;
        }

        setIsLoading(true)

        const newChatMessages = [
          ...chatMessages,
          {
            message: inputText,
            sender: "user",
            id: crypto.randomUUID()
          }
        ]

        setChatMessages([
          ...newChatMessages,
          {
            message: "Loading...",
            sender: "robot",
            id: crypto.randomUUID()
          }
        ])

        setInputText("")

        const response = await Chatbot.getResponseAsync(inputText)

        setChatMessages([
          ...newChatMessages,
          {
            message: response,
            sender: "robot",
            id: crypto.randomUUID()
          }
        ])

        setIsLoading(false)
      }

      return (
        <div className="chat-input-container">
          <input
            placeholder="Send a message to Chatbot" size="30"
            onChange={saveInputText} //runs a fn when we change input
            value={inputText}
            onKeyDown={sendUsingEnter}
            className="chat-input"
          />
          <button
            onClick={sendMessage}
            className="send-button"
          >Send</button>
        </div>
      )
    }

    function ChatMessage({ message, sender }) {
      // const {message,sender} = props.message

      // if(sender === "robot"){
      //   return (
      //     <div>
      //       <img src="robot.png" width="50" />
      //       {message}
      //     </div>
      //   )
      // }

      return (
        <div className={
          sender === "user"
            ? "chat-message-user"
            : "chat-message-robot"
        }>
          {sender === "robot" && (
            <img src="robot.png" className="chat-message-profile" />
          )}
          <div className="chat-message-text">
            {message}
          </div>
          {sender === "user" && (
            <img src="user.png" className="chat-message-profile" />
          )}
        </div>
      )
    }

    function ChatMessages({ chatMessages }) {
      // state = data that is connected to the HTML
      // when we update this data, it will update the HTML
      // const [chatMessages,setChatMessages] = React.useState([
      //   {
      //     message : "hello chatbot",
      //     sender : "user",
      //     id: "id1"

      //   },
      //   {
      //     message : "Hello! How can I help you?",
      //     sender : "robot",
      //     id: "id2"
      //   },
      //   {
      //     message : "can you get me todays date?",
      //     sender : "user",
      //     id: "id3"
      //   },
      //   {
      //     message : "Today is September 27",
      //     sender : "robot",
      //     id: "id4"
      //   }
      // ])
      // // const chatMessages = arr[0]; // current data
      // // const setChatMessages = arr[1] // fn that updates the data // updater fn.
      // // const [chatMessages,setChatMessages] = arr
      const chatMessagesRef = React.useRef(null);
      
      React.useEffect(()=>{
        const containerElem = chatMessagesRef.current
        if(containerElem){
          containerElem.scrollTop = containerElem.scrollHeight
        }
      },[chatMessages]);
      return (
        <div className="chat-messages-container"
        ref = {chatMessagesRef}>
          {chatMessages.map((chatMessage) => {
            return (
              <ChatMessage
                message={chatMessage.message}
                sender={chatMessage.sender}
                key={chatMessage.id}
              />
            )
          })}
        </div>
      )
    }

    function App() {
      const [chatMessages, setChatMessages] = React.useState([
        {
          message: "hello chatbot",
          sender: "user",
          id: "id1"

        },
        {
          message: "Hello! How can I help you?",
          sender: "robot",
          id: "id2"
        },
        {
          message: "can you get me todays date?",
          sender: "user",
          id: "id3"
        },
        {
          message: "Today is September 27",
          sender: "robot",
          id: "id4"
        }
      ])
      // const chatMessages = arr[0]; // current data
      // const setChatMessages = arr[1] // fn that updates the data // updater fn.
      // const [chatMessages,setChatMessages] = arr
      return (
        <div className="app-container">
          <ChatMessages
            chatMessages={chatMessages}
          />
          <ChatInput
            chatMessages={chatMessages}
            setChatMessages={setChatMessages}
          />
        </div>
      )
    }

    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App />);
  </script>
</body>

</html>
