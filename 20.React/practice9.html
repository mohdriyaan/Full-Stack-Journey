<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    function arrSwap(arr){
      let temp = arr[0]
      arr[0] = arr[arr.length-1]
      arr[arr.length-1] = temp
      console.log(arr)
    }
    function addOne(arr){
      let newArr = []
      for(let i = 0; i<arr.length;i++){
        arr[i]+=1
        newArr.push(arr[i])
      }
      console.log(newArr)
    }
    function addNum(arr,num){
      const addArr = []
      for(let i = 0; i<arr.length;i++){
        arr[i]+=num
        addArr.push(arr[i])
      }
      console.log(addArr)
    }
    function addArrays(arr1,arr2){
      const newArr = []
      if(arr1.length!==arr2.length){
        console.log("Both arrays should same no of elements")
        return;
      }
      for(let i = 0 ; i<arr1.length; i++){
        arr1[i]+=arr2[i]
        newArr.push(arr1[i])
      }
      console.log(newArr)
    }
    function countPositive(nums){
      let count = 0
      for(let i = 0; i<nums.length;i++){
        if(nums[i]>0){
          count++
        }
      }
      console.log(count)
    }
    function minMax(arr){
      let obj = {
        min: 0,
        max: 0
      }
      if(arr.length==0){
        obj.min = null
        obj.max = null
        console.log(obj)
        return;
      }
      if(arr.length==1){
        obj.min = arr[0]
        obj.max = arr[0]
        console.log(obj)
        return;
      }
      for(let i = 0; i<arr.length;i++){
        let tempArr = arr[i] 
        if(tempArr<=obj.min){   
          obj.min = arr[i] 
        }
        if(tempArr>=obj.max){
          obj.max = arr[i]
        }
                  
      }
      console.log(obj)
      return;
    }
    function countWords(words){
      const obj = {}
      for(let i = 0; i<words.length;i++){
        const word = words[i]
        if(!obj[word]){
          obj[word] = 1
        }else{
          obj[word]++
        }
      }
      console.log(obj)
    }
    
    arrSwap(["hi","hello","good"])
    addOne([-2,0,99,1])
    addNum([1,2,3],3)
    addArrays([1,2,10],[1,1,3])
    countPositive([1,-3,5,10])
    minMax([1,-3,5])
    minMax([])
    minMax([10,2,20,30,-10])
    minMax([-2,3,-5,7,10])
    countWords(["apple","apple","grape"])
  </script>
</body>
</html>
