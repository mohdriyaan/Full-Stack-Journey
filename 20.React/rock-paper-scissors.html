<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/rock-paper-scissors.css">
  <title>rock paper scissors</title>
</head>

<body>
  <p class="title">Rock Paper Scissors</p>
  <button class="move-button rock-btn"><img src="images/Rock-emoji.png" class="move-icon"
      alt=""></button>
  <button class="move-button paper-btn"><img src="images/Paper-emoji.png" class="move-icon"
      alt=""></button>
  <button class="move-button scissor-btn"><img src="images/Scissors-emoji.png" class="move-icon"
      alt=""></button>

  <p class="js-result result"></p>
  <p class="js-moves"></p>
  <p class="js-score score"></p>

  <button class="reset-score">Reset Score
  </button>

  <button class="auto-btn">
    Auto Play
  </button>

  <div class="confirm-mssg"></div>

  <script src="scripts/rock-paper-scissors.js"></script>
</body>

</html>
