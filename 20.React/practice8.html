<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .amazon-btn{
      background-color: rgb(255,216,20);
      color: black;
      border: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
      padding: 10px 50px;
      border-radius: 20px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .btn{
      background-color: lightgray;
      color: black;
      font-size: 20px;
      border: none;
      padding: 15px;
      border-radius: 10px;
      cursor: pointer;
    }
    .is-toggled{
      background-color: black;
      color: white;
      cursor: pointer;
    }
  </style>
  <title>HTML-CSS-JS</title>
</head>
<body>
  <button class="amazon-btn">Add to Cart</button>
  <button class="js-button">Test</button>
  <button class="gaming-btn btn" onclick="toggle(`gaming-btn`)">Gaming</button>
  <button class="music-btn btn" onclick="toggle(`music-btn`)">Music</button>
  <button class="tech-btn btn" onclick="toggle(`tech-btn`)">Tech</button>

  <script>
    const btn = document.querySelector(".js-button")
    const result = btn.classList.contains("js-button")
    let isToggled = ""

    function toggle(element){
      if(isToggled!=""){
        let previousBtn = document.querySelector(`.${isToggled}`)
        previousBtn.classList.remove("is-toggled")
      }
      const btn = document.querySelector(`.${element}`)
      if(element!==isToggled){
        btn.classList.add("is-toggled")
        isToggled = element
      }else{
        isToggled=""
      }
      
    }
  </script>
</body>
</html>
