<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArmStrong Numbers</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Armstrong Numbers</h1>

    <div class="theme-toggle">
        <input type="checkbox" id="toggleMode">
        <label for="toggleMode" class="switch"></label>
    </div>

    <form action="">
        <label for="minNumber">Enter the min number: </label>
        <input type="text" id="minNumber">
        <label for="maxNumber">Enter the max number: </label>
        <input type="text" id="maxNumber">
        <button id="submit">Submit</button>
        <label for="output">Output:- </label>
        <input type="text" id="output" readonly>
    </form>
    <script src="app.js"></script>
</body>
</html>
