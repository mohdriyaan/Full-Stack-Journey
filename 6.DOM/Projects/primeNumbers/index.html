<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Numbers</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>🔢 Prime Number Finder</h1>

        <form action="">
            <label for="lowRange">Enter Low Range</label>
            <input type="text" id="lowRange" placeholder="e.g., 5">

            <label for="highRange">Enter High Range</label>
            <input type="text" id="highRange" placeholder="e.g., 50">

            <button id="btn">Find Primes</button>

            <label for="output">Prime Numbers:</label>
            <input type="text" id="output" readonly>
        </form>
    </div>

    <script src="app.js"></script>
</body>

</html>
